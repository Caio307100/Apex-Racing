name: Build Linux release

on:
  push:
    tags:
      - "v*"
    branches:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev libgl1-mesa-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Package
        run: |
          mkdir -p package
          cp build/apex-racing package/
          tar -C package -czf apex-racing-linux-x86_64.tar.gz apex-racing
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Apex Racing ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          generate_release_notes: true
          files: apex-racing-linux-x86_64.tar.gz
